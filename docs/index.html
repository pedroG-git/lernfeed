<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lernfeed</title>
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --text: #1a1c20; --muted: #6b7080; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16181c; --card: #20232a; --text: #e8e9ec; --muted: #9a9fad; --accent: #6b9bff; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, sans-serif; }
    main { max-width: 480px; margin: 12vh auto; padding: 0 20px; text-align: center; }
    a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 14px 26px; border-radius: 12px; font-weight: 600; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Lernfeed</h1>
    <p>Lernstoff als Feed – offline auf dem Handy.</p>
    <p><a class="btn" href="https://github.com/pedroG-git/lernfeed/releases/latest/download/lernfeed.apk">APK laden</a></p>
    <p id="v"></p>
    <p>Nach dem Download die Datei öffnen, um die App zu installieren oder zu aktualisieren.</p>
  </main>
  <script>
    fetch('version.json?t=' + Date.now()).then((r) => r.json()).then((j) => { if (j.version !== '0.0.0') document.getElementById('v').textContent = 'Version ' + j.version; }).catch(() => {});
  </script>
</body>
</html>
